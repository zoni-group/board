name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install browser test dependencies
        run: npx playwright install --with-deps chromium webkit

      - name: Browser tests
        run: npm run test:e2e

      - name: Browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-traces
          path: test-results
          retention-days: 7
