  <script>
    (function(){
      var l = navigator.language && navigator.language.startsWith('es') ? 'es' : 'en';
      document.documentElement.lang = l;
      window.__lang = l;
    })();

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon_dark.svg?v=2" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/svg+xml" href="/favicon_ligth.svg?v=2" media="(prefers-color-scheme: light)" />
  <link id="favicon-fallback" rel="icon" type="image/svg+xml" href="/favicon_ligth.svg?v=2" />
  <link id="shortcut-favicon" rel="shortcut icon" href="/favicon_ligth.svg?v=2" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <script>
    (function () {
      var query = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
      var icons = [
        document.getElementById("favicon-fallback"),
        document.getElementById("shortcut-favicon")
      ];

      function applyThemeFavicon() {
        var href = (query && query.matches ? "/favicon_dark.svg" : "/favicon_ligth.svg") + "?v=2";
        icons.forEach(function (icon) {
          if (icon) icon.href = href;
        });
      }

      applyThemeFavicon();
      if (!query) return;
      if (query.addEventListener) query.addEventListener("change", applyThemeFavicon);
      else if (query.addListener) query.addListener(applyThemeFavicon);
    })();
  </script>

  <!-- Primary SEO -->

  <style>
    .sr-only{
      position:absolute !important;
      width:1px;height:1px;
      padding:0;margin:-1px;
      overflow:hidden;
      clip:rect(0,0,0,0);
      white-space:nowrap;border:0;
    }
  </style>
</head>

<body>
  <h1 class="sr-only">ZONI® Board – Local Drawing Board</h1>
  <p class="sr-only">
    ZONI® Board is a full-screen drawing board optimized for touch and in-car browsers.
    Use pen or eraser, adjust brush size, autosave drawings locally in your browser, and download PNG files to your device.
  </p>

  <div class="app">
    <header>
      <div class="header-inner">
        <div class="brand" data-i18n-title="tagline" title="Simple local drawing board by ZONI">
          <a href="https://www.zoni.edu" target="_blank" rel="noopener noreferrer" class="brand-logo-link">
            <picture class="brand-logo" aria-hidden="true">
              <source srcset="/favicon.svg" media="(max-width: 500px)" />
              <source srcset="/img/vb_logo_dark.svg" media="(prefers-color-scheme: dark)" />
              <source srcset="/img/vb_logo_light.svg" media="(prefers-color-scheme: light)" />
              <img src="/img/vb_logo_light.svg" alt="" width="757" height="107" decoding="async" />
            </picture>
          </a>
          <span class="sr-only" data-i18n="brand">ZONI® Board</span>
          <button id="langToggle" type="button" class="lang-toggle" aria-label="Change language">EN</button>
        </div>

        <div class="toolbar" role="toolbar" aria-label="Drawing tools">
          <div class="board-action-strip">
            <button
              id="pen"
              type="button"
              class="board-action-btn board-action-btn-pen"
              aria-pressed="true"
              data-i18n-aria="pen"
              data-i18n-title="pen"
              aria-label="Pen"
              title="Pen"
            >
              <span class="btn-icon" aria-hidden="true"></span>
            </button>
            <button
              id="erase"
              type="button"
              class="board-action-btn board-action-btn-erase"
              aria-pressed="false"
              data-i18n-aria="eraser"
              data-i18n-title="eraser"
              aria-label="Eraser"
              title="Eraser"
            >
              <span class="btn-icon" aria-hidden="true"></span>
            </button>
            <button
              id="undo"
              type="button"
              class="board-action-btn board-action-btn-undo"
              data-i18n-aria="undo"
              data-i18n-title="undo"
              aria-label="Undo"
              title="Undo"
              disabled
            >
              <span class="btn-icon" aria-hidden="true"></span>
            </button>
            <button
              id="redo"
              type="button"
              class="board-action-btn board-action-btn-redo"
              data-i18n-aria="redo"
              data-i18n-title="redo"
              aria-label="Redo"
              title="Redo"
              disabled
            >
              <span class="btn-icon" aria-hidden="true"></span>
            </button>
            <button
              id="clear"
              type="button"
              class="board-action-btn board-action-btn-clear"
              data-i18n-aria="clear"
              data-i18n-title="clear"
              aria-label="Clear"
              title="Clear"
            >
              <span class="btn-icon" aria-hidden="true"></span>
            </button>
            <button
              id="save"
              type="button"
              class="board-action-btn board-action-btn-save"
              data-i18n-aria="savePng"
              data-i18n-title="savePng"
              aria-label="Save PNG"
              title="Save PNG"
            >
              <span class="btn-icon" aria-hidden="true"></span>
            </button>
          </div>

          <div class="size-label">
            <button
              id="sizePreview"
              type="button"
              class="size-preview"
              data-i18n-aria="moreColors"
              aria-label="More colors"
              title="More colors"
            >
              <span class="size-preview-stroke"></span>
            </button>
            <input id="size" type="range" min="2" max="22" value="6" data-i18n-aria="size" aria-label="Size" />
            <div id="swatches" class="swatches" data-i18n-aria="presetColors" aria-label="Preset colors"></div>
          </div>

          <div id="colorPopup" class="color-popup" hidden>
            <div class="color-popup-card">
              <!-- NEW: iro.js mount point -->
              <div id="iroPicker" class="iro-picker" aria-label="Color picker"></div>

              <div class="color-popup-row">
                <span data-i18n="hex">Hex</span>
                <input id="hexInput" class="hex-input" type="text" inputmode="text" autocomplete="off" spellcheck="false" />
                <button id="colorPopupClose" type="button" data-i18n="close">Close</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main>
      <div class="canvas-shell">
        <div class="canvas-frame">
          <canvas id="pad" aria-label="Drawing canvas"></canvas>
          <div class="right-stack board-canvas-meta" aria-label="Status and attribution">
            <span id="status" class="status" data-i18n="ready">Ready</span>
            <span class="attribution" aria-label="Local save notice">
              <span data-i18n="localOnly">Saved on this device only</span>
            </span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="/src/board/board.js"></script>
</body>
</html>
