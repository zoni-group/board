<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <script>
    (function(){
      var l = navigator.language && navigator.language.startsWith('es') ? 'es' : 'en';
      document.documentElement.lang = l;
      window.__lang = l;
      try {
        var theme = localStorage.getItem('zoni_board_theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon_dark.svg?v=2" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/svg+xml" href="/favicon_ligth.svg?v=2" media="(prefers-color-scheme: light)" />
  <link id="favicon-fallback" rel="icon" type="image/svg+xml" href="/favicon_ligth.svg?v=2" />
  <link id="shortcut-favicon" rel="shortcut icon" href="/favicon_ligth.svg?v=2" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <script>
    (function () {
      var query = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
      var icons = [
        document.getElementById("favicon-fallback"),
        document.getElementById("shortcut-favicon")
      ];

      function applyThemeFavicon() {
        var href = (query && query.matches ? "/favicon_dark.svg" : "/favicon_ligth.svg") + "?v=2";
        icons.forEach(function (icon) {
          if (icon) icon.href = href;
        });
      }

      applyThemeFavicon();
      if (!query) return;
      if (query.addEventListener) query.addEventListener("change", applyThemeFavicon);
      else if (query.addListener) query.addListener(applyThemeFavicon);
    })();
  </script>

  <!-- Primary SEO -->
  <title>ZONI® Board – Local Drawing Board</title>
  <meta name="description" content="ZONI® Board is a fast, full-screen local drawing board for touch devices browser. Draw with pen or eraser, adjust brush size, and save PNG files on your device." />

  <style>
    .sr-only{
      position:absolute !important;
      width:1px;height:1px;
      padding:0;margin:-1px;
      overflow:hidden;
      clip:rect(0,0,0,0);
      white-space:nowrap;border:0;
    }
  </style>
</head>

<body>
  <h1 class="sr-only">ZONI® Board – Local Drawing Board</h1>
  <p class="sr-only">
    ZONI® Board is a full-screen drawing board optimized for touch and in-car browsers.
    Use pen or eraser, adjust brush size, autosave drawings locally in your browser, and download PNG files to your device.
  </p>

  <div class="app">
    <header>
      <div class="header-inner">
        <div class="brand" data-i18n-title="tagline" title="Simple local drawing board by ZONI">
          <a href="https://www.zoni.edu" target="_blank" rel="noopener noreferrer" class="brand-logo-link">
            <picture class="brand-logo" aria-hidden="true">
              <source srcset="/favicon_dark.svg" media="(max-width: 500px) and (prefers-color-scheme: dark)" />
              <source srcset="/favicon_ligth.svg" media="(max-width: 500px) and (prefers-color-scheme: light)" />
              <source srcset="/img/vb_logo_dark.svg" media="(prefers-color-scheme: dark)" />
              <source srcset="/img/vb_logo_light.svg" media="(prefers-color-scheme: light)" />
              <img src="/img/vb_logo_light.svg" alt="" width="208" height="31" decoding="async" />
            </picture>
          </a>
          <span class="sr-only" data-i18n="brand">ZONI® Board</span>
          <button id="langToggle" type="button" class="lang-toggle" aria-label="Change language">EN</button>
        </div>

        <div class="toolbar" role="toolbar" aria-label="Drawing tools">
          <div class="board-action-strip">
            <button
              id="pen"
              type="button"
              class="board-action-btn board-action-btn-pen"
              aria-pressed="true"
              aria-label="Pen"
              title="Pen"
            >
              <span class="btn-icon" aria-hidden="true"></span>
            </button>
            <button
              id="text"
              type="button"
              class="board-action-btn"
              aria-pressed="false"
              data-i18n-aria="addObject"
              data-i18n-title="addObject"
              aria-label="Add object"
              title="Add object"
              disabled
            >
              <span class="btn-icon" aria-hidden="true"></span>
            </button>
            <button
              id="shapes"
              type="button"
              class="board-action-btn"
              aria-pressed="false"
              aria-expanded="false"
              aria-haspopup="dialog"
              data-i18n-aria="shapes"
              data-i18n-title="shapes"
              aria-label="Shapes"
              title="Shapes"
              disabled
            >
              <span class="btn-icon" aria-hidden="true"></span>
            </button>
            <button
              id="erase"
              type="button"
              class="board-action-btn board-action-btn-erase"
              aria-pressed="false"
              data-i18n-aria="eraser"
              data-i18n-title="eraser"
              aria-label="Eraser"
              title="Eraser"
            >
              <span class="btn-icon" aria-hidden="true"></span>
            </button>
            <button
              id="undo"
              type="button"
              class="board-action-btn board-action-btn-undo"
              data-i18n-aria="undo"
              data-i18n-title="undo"
              aria-label="Undo"
              title="Undo"
              disabled
            >
              <span class="btn-icon" aria-hidden="true"></span>
            </button>
            <button
              id="redo"
              type="button"
              class="board-action-btn board-action-btn-redo"
              data-i18n-aria="redo"
              data-i18n-title="redo"
              aria-label="Redo"
              title="Redo"
              disabled
            >
              <span class="btn-icon" aria-hidden="true"></span>
            </button>
            <button id="boards" type="button" class="board-action-btn" aria-expanded="false" aria-haspopup="dialog" aria-label="Boards" title="Boards" disabled>
              <span class="btn-icon" aria-hidden="true"></span>
            </button>
          </div>

          <div class="size-label">
            <button
              id="sizePreview"
              type="button"
              class="size-preview"
              data-i18n-aria="moreColors"
              aria-label="More colors"
              title="More colors"
            >
              <span class="size-preview-stroke"></span>
            </button>
            <input id="size" type="range" min="2" max="22" value="6" data-i18n-aria="size" aria-label="Size" />
            <div id="swatches" class="swatches" data-i18n-aria="presetColors" aria-label="Preset colors"></div>
          </div>

        </div>
      </div>
    </header>

    <main>
      <div class="canvas-shell">
        <div class="canvas-frame">
          <canvas id="pad" tabindex="0" aria-label="Drawing canvas"></canvas>
          <canvas id="shapeLayer" class="board-shape-layer" aria-hidden="true"></canvas>
          <canvas id="textLayer" class="board-text-layer" aria-hidden="true"></canvas>
          <canvas id="laserLayer" class="board-laser-layer" aria-hidden="true"></canvas>
          <nav id="pageNav" class="page-nav" aria-label="Pages" data-i18n-aria="pages" hidden>
            <button id="prevPage" type="button" aria-label="Previous page" data-i18n-aria="previousPage" data-i18n-title="previousPage" title="Previous page"><span class="btn-icon" aria-hidden="true"></span></button>
            <button id="pageMenuButton" type="button" class="page-label" aria-haspopup="menu" aria-expanded="false" aria-controls="pageMenu"></button>
            <span id="pageLive" class="sr-only" aria-live="polite"></span>
            <button id="nextPage" type="button" aria-label="Next page" data-i18n-aria="nextPage" data-i18n-title="nextPage" title="Next page"><span class="btn-icon" aria-hidden="true"></span></button>
          </nav>
          <div class="right-stack board-canvas-meta" aria-label="Status and attribution">
            <span id="status" class="status" data-i18n="ready">Ready</span>
            <span class="attribution" aria-label="Local save notice">
              <span id="boardName"></span><span aria-hidden="true"> · </span><span data-i18n="localOnly">Saved on this device only</span>
            </span>
          </div>
        </div>
      </div>
    </main>
    <div id="boardMenu" class="board-menu" role="dialog" aria-label="Boards" data-i18n-aria="boards" hidden>
      <div class="board-menu-header">
        <small data-i18n="boardLabel">Board</small>
        <strong data-board-name></strong>
      </div>
      <button id="newBoard" type="button" class="menu-item"><span class="btn-icon" aria-hidden="true"></span><span data-i18n="newBoard">New board</span></button>
      <button id="openBoards" type="button" class="menu-item"><span class="btn-icon" aria-hidden="true"></span><span data-i18n="openBoards">Open boards…</span></button>
      <button id="addPage" type="button" class="menu-item"><span class="btn-icon" aria-hidden="true"></span><span data-i18n="addPage">Add page</span></button>
      <hr />
      <button id="exportBoard" type="button" class="menu-item"><span class="btn-icon" aria-hidden="true"></span><span data-i18n="exportBoard">Export board</span></button>
      <button id="exportAllBoards" type="button" class="menu-item"><span class="btn-icon" aria-hidden="true"></span><span data-i18n="exportAllBoards">Export all boards</span></button>
      <button id="importBoards" type="button" class="menu-item"><span class="btn-icon" aria-hidden="true"></span><span data-i18n="importBoards">Import boards…</span></button>
      <button id="save" type="button" class="menu-item"><span class="btn-icon" aria-hidden="true"></span><span data-i18n="savePng">Save PNG</span></button>
      <hr />
      <button id="boardSettings" type="button" class="menu-item"><span class="btn-icon" aria-hidden="true"></span><span data-i18n="settingsMenu">Settings…</span></button>
      <hr />
      <button id="clear" type="button" class="menu-item destructive"><span class="btn-icon" aria-hidden="true"></span><span data-i18n="clearDrawing">Clear drawing</span></button>
    </div>
    <div id="colorPopup" class="color-popup" hidden>
      <div class="color-popup-card">
        <div class="color-popup-body">
          <div id="iroPicker" class="iro-picker" aria-label="Color picker"></div>
        </div>

        <div class="color-popup-row">
          <span data-i18n="hex">Hex</span>
          <input id="hexInput" class="hex-input" type="text" inputmode="text" autocomplete="off" spellcheck="false" />
          <button id="colorPopupClose" type="button" data-i18n="close">Close</button>
        </div>
      </div>
    </div>
    <div
      class="board-navigation"
      role="toolbar"
      data-i18n-aria="navigation"
      aria-label="Board navigation"
    >
      <button
        id="select"
        type="button"
        aria-pressed="false"
        aria-label="Select"
        title="Select"
        disabled
      >
        <span class="btn-icon" aria-hidden="true"></span>
      </button>
      <button
        id="hand"
        type="button"
        aria-pressed="false"
        data-i18n-aria="hand"
        data-i18n-title="navigationHint"
        aria-label="Hand"
        title="Drag to move. Use two fingers to move or zoom."
      >
        <span class="btn-icon" aria-hidden="true"></span>
      </button>
      <button
        id="zoomOut"
        type="button"
        data-i18n-aria="zoomOut"
        data-i18n-title="zoomOut"
        aria-label="Zoom out"
        title="Zoom out"
      >
        −
      </button>
      <button
        id="zoomReset"
        type="button"
        data-i18n-title="resetZoom"
        aria-label="Reset zoom to 100%"
        title="Reset zoom to 100%"
      >
        100%
      </button>
      <button
        id="zoomIn"
        type="button"
        data-i18n-aria="zoomIn"
        data-i18n-title="zoomIn"
        aria-label="Zoom in"
        title="Zoom in"
      >
        +
      </button>
      <button
        id="fitDrawing"
        type="button"
        data-i18n-aria="fitDrawing"
        data-i18n-title="fitDrawing"
        aria-label="Fit drawing"
        title="Fit drawing"
      >
        <span class="btn-icon" aria-hidden="true"></span>
      </button>
    </div>
  </div>

  <script type="module" src="/src/board/board.ts"></script>
</body>
</html>
